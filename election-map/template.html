<style>
/* Layout: election-night board. Party tally band on top, chamber tabs, map left + detail panel right; stacks on phones. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --fg: #16202e;
  --muted: #5d6878;
  --line: #d9dfe7;
  --empty: #e3e7ed;
  --dem: #1f57b5;
  --rep: #c8312f;
  --toss: #c4b27a;
  --safe-d: #1d4f9e; --likely-d: #4f81cc; --lean-d: #9bbbe8;
  --safe-r: #a5221d; --likely-r: #d8625a; --lean-r: #f0aaa3;
  --focus: #e0a100;
  --font-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #161d27; --fg: #e8edf4; --muted: #9aa6b6; --line: #2a3442; --empty: #252e3b;
    --dem: #5b8fe6; --rep: #ec5d58; --toss: #b3a26b;
    --safe-d: #2c63bd; --likely-d: #5a8ad3; --lean-d: #8fb0e3;
    --safe-r: #c23a33; --likely-r: #dc6d65; --lean-r: #eda39c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #161d27; --fg: #e8edf4; --muted: #9aa6b6; --line: #2a3442; --empty: #252e3b;
  --dem: #5b8fe6; --rep: #ec5d58; --toss: #b3a26b;
  --safe-d: #2c63bd; --likely-d: #5a8ad3; --lean-d: #8fb0e3;
  --safe-r: #c23a33; --likely-r: #dc6d65; --lean-r: #eda39c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
h1 small { font-family: var(--font-num); font-weight: 600; color: var(--muted); font-size: 1rem; letter-spacing: .08em; margin-left: 8px; }
.status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.live { background: #2fa36b; box-shadow: 0 0 0 0 rgba(47,163,107,.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(47,163,107,0); } 100% { box-shadow: 0 0 0 0 rgba(47,163,107,0); } }
@media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } * { transition: none !important; } }

/* Tally band */
.proj { display: grid; gap: 10px; }
.proj-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.proj-head b { font-size: 1.05rem; }
.proj-head .sub { color: var(--muted); font-size: .8rem; }
.proj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; display: grid; gap: 8px; min-width: 0; }
.pcard .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pcard .ch { font-weight: 700; }
.pcard .ctl { font-size: .78rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; color: #fff; }
.pcard .score { display: flex; align-items: baseline; justify-content: space-between; font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; }
.pcard .score .d { color: var(--dem); font-size: 2.2rem; line-height: 1; }
.pcard .score .r { color: var(--rep); font-size: 2.2rem; line-height: 1; }
.pcard .score small { font-family: var(--font-body); font-weight: 400; font-size: .75rem; color: var(--muted); margin: 0 6px; }

.pcard .delta { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tally { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; }
.party { appearance: none; border: 2px solid transparent; background: transparent; color: var(--fg); font: inherit; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 12px; transition: background .15s, border-color .15s; }
.party:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
.party:focus-visible, .tab:focus-visible, .state:focus-visible, .district:focus-visible, .row:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.party[aria-pressed="true"].r { border-color: var(--rep); background: color-mix(in srgb, var(--rep) 10%, transparent); }

.party svg { width: 58px; height: 46px; flex: none; }
.party .num { font-family: var(--font-num); font-weight: 700; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.party.d .num { color: var(--dem); } .party.r .num { color: var(--rep); }
.party .lbl { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.party .hint { font-size: .72rem; color: var(--muted); }
.meter { display: grid; gap: 6px; min-width: 0; }
.bar { position: relative; height: 22px; border-radius: 6px; overflow: hidden; display: flex; background: var(--empty); }
.bar span { height: 100%; transition: width .4s; }

.meter .legend { display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.meter .legend b { color: var(--fg); font-family: var(--font-num); font-size: .95rem; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.navrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.years { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; }
.years select { font: inherit; font-family: var(--font-num); font-weight: 600; font-size: 1rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.years select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.flip { display: inline-block; font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; margin-left: 4px; vertical-align: 1px; }
.tab { appearance: none; font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 7px 16px; border-radius: 999px; font-weight: 500; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.main { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.mapbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; position: relative; min-width: 0; }
.mapbox svg { width: 100%; height: auto; display: block; }
.state { stroke: var(--surface); stroke-width: 1; cursor: pointer; transition: opacity .2s, fill .3s; }
.state:hover { stroke: var(--fg); stroke-width: 1.5; }
.state.sel { stroke: var(--fg); stroke-width: 2.5; }
.state.dim { opacity: .16; }
.state.tilt { opacity: .6; }
.zoombar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 2px 4px 10px; }

#dmap { max-height: 70vh; }
.district { stroke: var(--surface); stroke-width: .8; cursor: pointer; transition: opacity .2s; }
.district:hover { stroke: var(--fg); stroke-width: 1.4; }
.district.sel { stroke: var(--fg); stroke-width: 2.4; }
.district.dim { opacity: .16; }
.dnum { font-family: var(--font-num); font-size: 12px; font-weight: 700; fill: var(--fg); pointer-events: none; }
.dnum.on-dark { fill: #fff; }
.dcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.dcard h3 { margin: 0; font-size: 1rem; }
.abbr { font-family: var(--font-num); font-size: 10px; font-weight: 600; fill: var(--fg); pointer-events: none; opacity: .75; }
.abbr.on-dark { fill: #fff; opacity: .9; }
.keyrow { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 4px 0; font-size: .75rem; color: var(--muted); }
.keyrow i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: .8rem; max-width: 240px; z-index: 5; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; display: grid; gap: 12px; }
.panel h2 { margin: 0; font-size: 1.15rem; text-wrap: balance; }
.panel .sub { color: var(--muted); font-size: .82rem; margin: 0; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 700; color: #fff; }
.cands { display: grid; gap: 10px; }
.cand { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: baseline; }
.cand .who { font-weight: 500; }
.cand .pct { font-family: var(--font-num); font-weight: 700; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.cand .pbar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--empty); overflow: hidden; }
.cand .pbar span { display: block; height: 100%; }
.note { margin: 0; font-size: .9rem; }
.src { font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; }
.src a { color: inherit; }
.list { display: grid; gap: 4px; max-height: 460px; overflow-y: auto; }
.row { appearance: none; font: inherit; color: inherit; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 7px 4px; display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: center; cursor: pointer; }
.row:hover { background: color-mix(in srgb, var(--fg) 5%, transparent); }
.row .ab { font-family: var(--font-num); font-weight: 700; font-size: 1.05rem; }
.row .mg { font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.delegation { display: flex; height: 18px; border-radius: 5px; overflow: hidden; }
.delegation span { height: 100%; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px 12px; font-size: .82rem; }
.grid2 b { font-family: var(--font-num); font-size: 1rem; }
footer { color: var(--muted); font-size: .78rem; display: grid; gap: 4px; }
footer a { color: inherit; }

@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; }
  .tally { grid-template-columns: 1fr 1fr; }
  .meter { grid-column: 1 / -1; grid-row: 2; }
  .party .num { font-size: 2.1rem; }
  .party svg { width: 40px; height: 32px; }
  .party { padding: 6px; gap: 8px; }
  .party .hint { display: none; }
}
</style>

  // ---------- tally ----------

  // Keep only the newest entry per source (and chamber); refreshes append rather than replace.

    const key = $("key");
    key.innerHTML = (isResult() ? `<span><b>勝選差距</b>（大勝 ≥15、勝 5–15、險勝 &lt;5 個百分點）</span>` : zoom ? `<span><b>選區評級</b></span>` : "") + RATINGS.filter((k) => !isResult() || k !== "Toss-up" || (chamber === "house" && !zoom)).map((k) => `<span><i style="background:var(${RATING_VAR[k]})"></i>${RATING_ZH[k]}</span>`).join("") +
      (chamber !== "house" && !zoom ? `<span><i style="background:var(--empty)"></i>本次不改選</span>` : "");
  }

  // " · 52.1–46.3" style vote shares for a result record.
  function resPct(r) {
    if (r.uncontested) return " · 無對手";
    return typeof r.dPct === "number" && typeof r.rPct === "number" ? ` · ${r.dPct}–${r.rPct}` : "";
  }
  function headline(r) {
    if (!r) return "本次無此選舉";
    if (isResult()) {
      if (chamber === "house") {
        const dW = (r.districts || []).filter((d) => d.incumbentParty === "D").length;
        return `${r.seats} 席：民主 ${dW} · 共和 ${r.seats - dW}`;
      }
      return `${RATING_ZH[r.rating]}${resPct(r)}${r.ev ? ` · ${r.ev} 張選舉人票` : ""}${r.flip ? " · 翻盤" : ""}`;
    }
    if (chamber === "house") {
      const dF = (r.safeD || 0) + (r.likelyD || 0) + (r.leanD || 0), rF = (r.safeR || 0) + (r.likelyR || 0) + (r.leanR || 0);
      return `${r.seats} 席：民主看好 ${dF} · 拉鋸 ${r.tossup || 0} · 共和看好 ${rF}`;
    }
    const m = pollMargin(r);
    const poll = m === null ? "" : ` · 民調 ${r.demPct}–${r.repPct}`;
    return `${RATING_ZH[ratingOf(r)]}${poll}`;
  }

  function showTip(e, ab) {
    const tip = $("tip"), box = $("mapbox").getBoundingClientRect();
    tip.innerHTML = `<b>${esc(GEO[ab].name)}</b><br>${esc(headline(rec(ab)))}`;
    tip.hidden = false;
    let x = e.clientX - box.left + 14, y = e.clientY - box.top + 14;
    if (x > box.width - 250) x = e.clientX - box.left - 250;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }

  // ---------- side panel ----------
  function chipFor(rt) {
    const dark = /^(Safe|Likely)/.test(rt);
    return `<span class="chip" style="background:var(${RATING_VAR[rt]});color:${dark ? "#fff" : "var(--fg)"}">${RATING_ZH[rt]}</span>`;
  }
  function sourceLine(parts, url) {
    const u = safeUrl(url);
    return `<p class="src">${parts.filter(Boolean).map(esc).join(" · ")}${u ? ` · <a href="${esc(u)}" target="_blank" rel="noopener">來源</a>` : ""}</p>`;
  }

  const flipTag = (r) => (r && r.flip ? `<span class="flip">翻盤</span>` : "");
  function resultDetail(ab, r) {
    const name = GEO[ab].name;
    if (chamber === "house") {
      const ds = r.districts || [];
      const dW = ds.filter((d) => d.incumbentParty === "D").length;
      const flips = ds.filter((d) => d.flip);
      const dI = ds.filter((d) => d.incumbentParty === "I").length;
      return `<h2>${esc(name)} · ${year} 眾議院</h2>
        <p class="sub">${r.seats} 席：民主 ${dW} · 共和 ${r.seats - dW - dI}${dI ? ` · 無黨籍 ${dI}` : ""}${DGEO[ab] ? "" : "（此年份暫無選區地圖）"}</p>
        ${flips.length ? `<p class="note">翻盤選區：${flips.map((d) => esc(d.id)).join("、")}</p>` : ""}
        <button class="tab" id="back">返回總覽</button>`;
    }
    const cand = (who, pct, col, won) => `<div class="cand"><span class="who">${esc(who || "–")}${won ? ` <span class="sub">✔ 當選</span>` : ""}</span><span class="pct" style="color:var(${col})">${typeof pct === "number" ? pct + "%" : "–"}</span><div class="pbar"><span style="width:${typeof pct === "number" ? pct : 0}%;background:var(${col})"></span></div></div>`;
    const m = pollMargin(r);
    const split = r.evSplit ? Object.entries(r.evSplit).map(([k, v]) => (k === "D" ? "民主 " : "共和 ") + v).join("、") : "";
    return `<h2>${esc(name)} · ${year} ${CH[chamber].name}${r.special ? "（補選）" : ""}${r.oddYear ? `（${r.oddYear} 年）` : ""}</h2>
      <div>${chipFor(r.rating)}${flipTag(r)}</div>
      <div class="cands">${cand(r.dem, r.demPct, "--dem", r.winner !== "R")}${cand(r.rep, r.repPct, "--rep", r.winner === "R")}</div>
      ${m !== null ? `<p class="sub">得票差距：${m > 0 ? "民主 +" : "共和 +"}${Math.round(Math.abs(m) * 10) / 10} 個百分點</p>` : ""}
      ${r.ev ? `<p class="sub">選舉人票 ${r.ev} 張${split ? `（分配：${split}）` : ""}</p>` : ""}
      ${r.winner === "I" ? `<p class="note">當選人為無黨籍，與民主黨同一黨團，地圖以民主黨色標示。</p>` : ""}
      ${r.note ? `<p class="note">${esc(r.note)}</p>` : ""}
      <button class="tab" id="back">返回總覽</button>`;
  }

  function stateDetail(ab) {
    const r = rec(ab), name = GEO[ab].name;
    if (r && isResult()) return resultDetail(ab, r);
    if (!r) return `<h2>${esc(name)}</h2><p class="sub">${CH[chamber].name}：本次無此選舉</p><button class="tab" id="back">返回總覽</button>`;
    const rt = ratingOf(r);
    if (chamber === "house") {
      const segs = [["safeD", "Safe D"], ["likelyD", "Likely D"], ["leanD", "Lean D"], ["tossup", "Toss-up"], ["leanR", "Lean R"], ["likelyR", "Likely R"], ["safeR", "Safe R"]];
      const cur = r.current || {};
      return `<h2>${esc(name)} · 眾議院</h2>
        <p class="sub">${r.seats} 個選區 · 現任 民主 ${cur.D ?? "–"} / 共和 ${cur.R ?? "–"}${cur.I ? ` / 無黨籍 ${cur.I}` : ""}</p>
        <div class="delegation" role="img" aria-label="各選區評級">${segs.map(([k, rk]) => r[k] ? `<span style="width:${(r[k] / r.seats) * 100}%;background:var(${RATING_VAR[rk]})" title="${RATING_ZH[rk]} ${r[k]}"></span>` : "").join("")}</div>
        <div class="grid2">${segs.map(([k, rk]) => `<span>${RATING_ZH[rk]} <b>${r[k] || 0}</b></span>`).join("")}</div>
        ${r.tossupDistricts && r.tossupDistricts.length ? `<p class="note">拉鋸選區：${r.tossupDistricts.map(esc).join("、")}</p>` : ""}
        ${r.note ? `<p class="note">${esc(r.note)}</p>` : ""}
        ${sourceLine([meta.house && meta.house.ratingSource, "更新 " + (r.updated || meta.updated || "")], meta.house && meta.house.ratingUrl)}
        <button class="tab" id="back">返回總覽</button>`;
    }
    const m = pollMargin(r);
    const cand = (who, pct, col, inc) => `<div class="cand"><span class="who">${esc(who || "未定")}${inc ? ` <span class="sub">（現任黨）</span>` : ""}</span><span class="pct" style="color:var(${col})">${typeof pct === "number" ? pct + "%" : "–"}</span><div class="pbar"><span style="width:${typeof pct === "number" ? pct : 0}%;background:var(${col})"></span></div></div>`;
    return `<h2>${esc(name)} · ${CH[chamber].name}${r.special ? "（補選）" : ""}</h2>
      <div>${chipFor(rt)}</div>
      <div class="cands">${cand(r.dem, r.demPct, "--dem", r.incumbentParty === "D")}${cand(r.rep, r.repPct, "--rep", r.incumbentParty === "R")}</div>
      ${m !== null ? `<p class="sub">民調差距：${m === 0 ? "平手" : (m > 0 ? "民主 +" : "共和 +") + Math.round(Math.abs(m) * 10) / 10}${r.pollSource ? " · " + esc(r.pollSource) : ""}</p>` : `<p class="sub">尚無公開民調，依評級判斷</p>`}
      ${r.note ? `<p class="note">${esc(r.note)}</p>` : ""}
      ${sourceLine(["評級：" + (r.ratingSource || "—"), "更新 " + (r.updated || meta.updated || "")], r.url)}
      <button class="tab" id="back">返回總覽</button>`;
  }

  function districtCard(ab, n) {
    const d = districtsOf(ab)[n];
    if (!d) return `<div class="dcard"><h3>${esc(dName(ab, n))}</h3><p class="sub">尚無此選區資料</p></div>`;
    if (isResult()) return `<div class="dcard"><h3>${esc(dName(ab, n))} ${chipFor(d.rating)}${flipTag(d)}</h3>
      <div class="grid2"><span>當選：<b>${esc(d.incumbent || "–")}</b>（${esc(d.incumbentParty || "?")}）</span></div>
      ${d.uncontested ? `<p class="sub">無對手</p>` : `<div class="grid2"><span style="color:var(--dem)">民主 <b>${esc(d.dPct ?? "–")}%</b></span><span style="color:var(--rep)">共和 <b>${esc(d.rPct ?? "–")}%</b></span></div>`}
      ${d.note ? `<p class="note">${esc(d.note)}</p>` : ""}</div>`;
    const rt = RATINGS.includes(d.rating) ? d.rating : null;
    const inc = d.incumbent && d.incumbent !== "open" ? `${esc(d.incumbent)}（${esc(d.incumbentParty || "?")}）` : "開放席次";
    return `<div class="dcard"><h3>${esc(dName(ab, n))} ${rt ? chipFor(rt) : ""}</h3>
      <div class="grid2"><span>現任：${inc}</span>${d.pvi ? `<span>選區傾向 <b>${esc(d.pvi)}</b></span>` : ""}</div>
      ${d.dem || d.rep ? `<div class="grid2"><span style="color:var(--dem)">民主：${esc(d.dem || "–")}</span><span style="color:var(--rep)">共和：${esc(d.rep || "–")}</span></div>` : ""}
      ${d.note ? `<p class="note">${esc(d.note)}</p>` : ""}
      <p class="src">${d.basis === "lean" ? "依選區政黨傾向判定為穩固席次" : "評級：Cook Political Report"}</p></div>`;
  }
  function districtList(ab) {
    const gap = (d) => (isResult() ? (d.uncontested ? 999 : Math.abs((d.dPct ?? 0) - (d.rPct ?? 0))) : Math.abs(SCORE[d.rating] ?? 9));
    const ds = Object.values(districtsOf(ab)).sort((a, b) => gap(a) - gap(b) || a.district - b.district);
    if (!ds.length || ds.length === 1) return "";
    const right = (d) => (isResult() ? (d.uncontested ? "無對手" : typeof d.dPct === "number" && typeof d.rPct === "number" ? fmtM(d.dPct - d.rPct) : "") : d.pvi || "");
    return `<div><p class="sub"><b>眾議院選區</b>（由最競爭的排起，點擊查看）</p><div class="list">${ds.map((d) =>
      `<button class="row drow" data-n="${esc(d.district)}"><span class="ab">${esc(d.district)}</span><span>${esc(d.incumbent && d.incumbent !== "open" ? d.incumbent : "開放席次")}${flipTag(d)}<br>${RATINGS.includes(d.rating) ? chipFor(d.rating) : ""}</span><span class="mg">${esc(right(d))}</span></button>`).join("")}</div></div>`;
  }

  function partyList(p) {
    const name = p === "D" ? "民主黨" : "共和黨";
    const rows = Object.keys(GEO).map((ab) => ({ ab, r: rec(ab) })).filter((x) => x.r && advantage(x.r, p))
      .map((x) => ({ ...x, adv: advantage(x.r, p), s: SCORE[ratingOf(x.r)] * (p === "D" ? 1 : -1), m: pollMargin(x.r) }))
      .sort((a, b) => a.s - b.s || (Math.abs(a.m ?? 99) - Math.abs(b.m ?? 99)));
    const t = tally();
    return `<h2 style="color:var(${p === "D" ? "--dem" : "--rep"})">${name}${isResult() ? year + " 勝選州" : "優勢選區"}</h2>
      <p class="sub">${CH[chamber].name}：${rows.length} 州${isResult() ? "勝選" : "具優勢"} · ${isResult() ? "共" : "預估"} ${p === "D" ? t.D : t.R}${CH[chamber].unit}（過半 ${CH[chamber].majority}）。由${isResult() ? "差距最小" : "最競爭"}的排起。</p>
      <div class="list">${rows.map((x) => {
        const rt = ratingOf(x.r);
        const right = chamber === "house"
          ? `${p === "D" ? (x.r.safeD + x.r.likelyD + x.r.leanD) : (x.r.safeR + x.r.likelyR + x.r.leanR)}/${x.r.seats} 席`
          : chamber === "pres" ? `${x.r.ev} 票`
          : (x.m !== null ? fmtM(x.m) : "");
        return `<button class="row" data-st="${x.ab}"><span class="ab">${x.ab}</span><span>${esc(GEO[x.ab].name)}<br>${x.adv === "tilt" ? `<span class="sub">拉鋸 · 民調些微領先</span>` : chipFor(rt)}</span><span class="mg">${right}</span></button>`;
      }).join("") || `<p class="sub">目前沒有${name}優勢州。</p>`}</div>`;
  }

  function resultOverview() {
    const t = tally(), c = CH[chamber];
    const all = Object.keys(GEO).map((ab) => ({ ab, r: rec(ab) })).filter((x) => x.r);
    const flips = all.filter((x) => x.r.flip);
    const close = all.filter((x) => chamber !== "house" && pollMargin(x.r) !== null).sort((a, b) => Math.abs(pollMargin(a.r)) - Math.abs(pollMargin(b.r))).slice(0, 8);
    const hFlips = chamber === "house" ? all.flatMap((x) => (x.r.districts || []).filter((d) => d.flip).map((d) => ({ ab: x.ab, d }))) : [];
    const row = (x) => `<button class="row" data-st="${x.ab}"><span class="ab">${x.ab}</span><span>${esc(GEO[x.ab].name)}${flipTag(x.r)}</span><span class="mg">${esc(fmtM(pollMargin(x.r)))}</span></button>`;
    return `<h2>${year} ${c.name}選舉結果</h2>
      <p class="sub">${chamber === "senate" ? "100 席，過半 51" : c.note}。點擊驢子或大象查看各黨勝選州，點擊地圖查看各州${chamber === "pres" ? "" : "與眾議院選區"}結果。</p>
      <div class="grid2"><span>民主 <b>${t.D}</b></span><span>共和 <b>${t.R}</b></span></div>
      ${close.length ? `<div><p class="sub"><b>差距最小</b></p><div class="list">${close.map(row).join("")}</div></div>` : ""}
      ${flips.length && chamber !== "house" ? `<div><p class="sub"><b>翻盤</b>（席次易黨）</p><div class="list">${flips.map(row).join("")}</div></div>` : ""}
      ${hFlips.length ? `<div><p class="sub"><b>翻盤選區</b>（${hFlips.length} 席）</p><p class="note">${hFlips.map((x) => esc(x.d.id) + "（" + (x.d.incumbentParty === "D" ? "民→" : "共→") + "）").join("、").replace(/（民→）/g, "（轉民主）").replace(/（共→）/g, "（轉共和）")}</p></div>` : ""}
      <p class="src">資料來源：${esc((hist().sources || []).join("、") || "官方選舉結果")}</p>`;
  }

  function overview() {
    if (isResult()) return resultOverview();
    const t = tally(), c = CH[chamber];
    const keyRaces = Object.keys(GEO).map((ab) => ({ ab, r: rec(ab) })).filter((x) => x.r && ratingOf(x.r) === "Toss-up");
    const nat = meta.national || {};
    const fc = latestBySource(nat.forecasts).filter((f) => typeof f.demChance === "number").filter((f) => !f.chamber || f.chamber.toLowerCase().startsWith(chamber === "house" ? "house" : chamber === "senate" ? "senate" : "gov"));
    const gb = latestBySource(nat.genericBallot);
    return `<h2>${c.name}總覽</h2>
      <p class="sub">${c.note}。點擊驢子或大象查看優勢州，點擊地圖查看各州詳情。</p>
      <div class="grid2"><span>民主看好 <b>${t.D}</b></span><span>共和看好 <b>${t.R}</b></span><span>拉鋸 <b>${t.toss}</b></span></div>
      ${fc.length ? `<div><p class="sub"><b>預測</b></p>${fc.map((f) => `<p class="note">${esc(f.source)}：民主黨勝率 <b>${esc(f.demChance)}%</b>${f.note ? "（" + esc(f.note) + "）" : ""} <span class="src">${esc(f.date || "")}</span></p>`).join("")}</div>` : ""}
      ${chamber !== "gov" && gb.length ? `<div><p class="sub"><b>全國政黨支持度</b></p>${gb.map((g) => `<p class="note">${esc(g.source)}：${typeof g.dem === "number" ? `民主 ${esc(g.dem)}% · 共和 ${esc(g.rep)}%` : `<b>${esc(g.margin || "–")}</b>`} <span class="src">${esc(g.date || "")}</span></p>`).join("")}</div>` : ""}
      ${keyRaces.length ? `<div><p class="sub"><b>拉鋸${chamber === "house" ? "州" : "選戰"}</b></p><div class="list">${keyRaces.map((x) => `<button class="row" data-st="${x.ab}"><span class="ab">${x.ab}</span><span>${esc(GEO[x.ab].name)}</span><span class="mg">${esc(chamber === "house" || pollMargin(x.r) === null ? "" : fmtM(pollMargin(x.r)))}</span></button>`).join("")}</div></div>` : ""}`;
  }

  function renderPanel() {
    const panel = $("panel");
    if (selected) {
      // Years before 2020 have district results but no district maps: list them in the panel only.
      const nums = DGEO[selected] ? Object.keys(DGEO[selected].d) : Object.keys(districtsOf(selected));
      const hasD = nums.length > 0 && (!!DGEO[selected] || chamber === "house");
      const card = hasD && (dsel || nums.length === 1) ? districtCard(selected, dsel || nums[0]) : "";
      panel.innerHTML = card + stateDetail(selected) + (hasD ? districtList(selected) : "");
    } else panel.innerHTML = party ? partyList(party) : overview();
    panel.querySelectorAll(".row:not(.drow)").forEach((b) => b.addEventListener("click", () => selectState(b.dataset.st)));
    panel.querySelectorAll(".drow").forEach((b) => b.addEventListener("click", () => { dsel = dsel === b.dataset.n ? null : b.dataset.n; render(); }));
    const back = panel.querySelector("#back");
    if (back) back.addEventListener("click", () => { selected = null; dsel = null; render(); });
  }

  function renderStatus() {
    $("dot").classList.toggle("live", live && !isResult());
    $("foot-note").textContent = isResult()
      ? "顏色代表勝選黨與得票差距：大勝 ≥15、勝 5–15、險勝 <5 個百分點。"
      : "評級分「穩固 / 傾向 / 微傾 / 拉鋸」。拉鋸州以最新民調領先者標示為「些微領先」。民調與預測不是選舉結果。";
    if (isResult()) { $("status").textContent = year + " 選後結果"; $("foot-src").textContent = "資料來源：" + ((hist().sources || []).join("、") || "官方選舉結果"); return; }
    $("status").textContent = (live ? "即時同步 · " : "資料快照 · ") + "更新於 " + (meta.updated || "—");
    const h = meta.house || {};
    $("foot-src").textContent = `資料來源：各州民調、${h.ratingSource || "Cook Political Report"} 等評級機構、Decision Desk HQ 與預測市場；由 Claude 定期彙整。`;
  }

  function render() {
    document.querySelectorAll(".tab[role=tab]").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.ch === chamber)));
    // Past years show only the offices the dataset covers (no President before 2000, Governor before 1996, House 1982–96).
    document.querySelectorAll(".tab[role=tab]").forEach((t) => { t.hidden = !hasChamber(t.dataset.ch); });
    $("h1-text").textContent = yearLabel(year)[0]; $("h1-date").textContent = yearLabel(year)[1];
    document.querySelectorAll(".party .hint").forEach((h) => { h.textContent = isResult() ? "點擊看勝選州" : "點擊看優勢選區"; });
    $("year-select").value = year;
    $("btn-D").setAttribute("aria-pressed", String(party === "D"));
    $("btn-R").setAttribute("aria-pressed", String(party === "R"));
    renderProjection(); renderTally(); renderMap(); renderPanel(); renderStatus();
  }

  function selectState(ab) { selected = selected === ab ? null : ab; dsel = null; render(); }
  function setParty(p) { party = party === p ? null : p; if (!selected) dsel = null; render(); }
  $("zoom-back").addEventListener("click", () => { selected = null; dsel = null; render(); });
  $("btn-D").addEventListener("click", () => setParty("D"));
  $("btn-R").addEventListener("click", () => setParty("R"));
  function hasChamber(ch) {
    if (!isResult()) return ch !== "pres";
    return Object.keys(races).some((k) => k.startsWith(ch + "-"));
  }

  // Switch the whole page to another election year; past years load once from history/<year>.json.
  async function setYear(y) {
    if (y === year) return;
    if (y !== "2026" && !HIST[y]) {
      $("status").textContent = "載入 " + y + " 年資料中…";
      try {
        const res = await fetch("history/" + y + ".json");
        if (!res.ok) throw new Error(res.status);
        HIST[y] = await res.json();
      } catch (e) {
        $("status").textContent = y + " 年資料無法載入（本機開啟時請用 python3 -m http.server）";
        $("year-select").value = year;
        return;
      }
    }
    year = y;
    races = y === "2026" ? LIVE_RACES : HIST[y].races;
    DGEO = y === "2026" ? DGEO_LIVE : HIST[y].dgeo;
    RATING_ZH = y === "2026" ? RATING_ZH_FORECAST : RATING_ZH_RESULT;
    if (!hasChamber(chamber)) chamber = "senate";
    builtFor = null; dsel = null;
    if (selected && !DGEO[selected]) selected = null;
    render();
  }
  $("year-select").addEventListener("change", (e) => setYear(e.target.value));
  document.querySelectorAll(".tab[role=tab]").forEach((t) => t.addEventListener("click", () => {
    chamber = t.dataset.ch; render();
    try { history.replaceState(null, "", "#" + chamber); } catch (e) {}
  }));

  render();

  // ---------- live data (artifact db) ----------
  // Claude's scheduled refresh writes races/<chamber>-<ST> and meta/summary; viewers only read.
  (async function connect() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    let db = null;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) return;
    let pending = null;
    const later = () => { if (!pending) pending = requestAnimationFrame(() => { pending = null; render(); }); };
    db.collection("races").onSnapshot((snap) => {
      for (const d of snap.docs) if (d.exists) LIVE_RACES[d.id] = d.data();
      live = true; later();
    }, () => { live = false; later(); });
    db.doc("meta/summary").onSnapshot((snap) => {
      if (snap.exists) { meta = Object.assign({}, meta, snap.data()); }
      later();
    }, () => {});
  })();
})();
</script>
