name: Build Windows exe

on:
  push:
    branches: ["**"]
    paths: ["*.py", "requirements.txt", "tests/**", ".github/workflows/build-exe.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name TarotResizer --collect-all tkinterdnd2 tarot_resizer.py
      - uses: actions/upload-artifact@v4
        with:
          name: TarotResizer
          path: dist/TarotResizer.exe
